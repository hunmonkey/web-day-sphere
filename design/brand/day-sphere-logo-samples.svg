<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1600" viewBox="0 0 2200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Day Sphere logo samples</title>
  <desc id="desc">Five vector logo concepts for Day Sphere, each with an Android app icon preview and wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf3ff"/>
      <stop offset="0.55" stop-color="#f8f6ff"/>
      <stop offset="1" stop-color="#eefbf7"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f7cff"/>
      <stop offset="1" stop-color="#6fe0c6"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="0.55" stop-color="#ff7e67"/>
      <stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18233f"/>
      <stop offset="1" stop-color="#2f9c95"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b5cff"/>
      <stop offset="0.58" stop-color="#b160ff"/>
      <stop offset="1" stop-color="#37d5ff"/>
    </linearGradient>
    <linearGradient id="calm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fb6ff"/>
      <stop offset="0.5" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#f7d56e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#24324f" flood-opacity="0.14"/>
    </filter>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#17213a" flood-opacity="0.20"/>
    </filter>
    <style>
      .card { fill: rgba(255,255,255,0.78); stroke: rgba(24,35,63,0.08); stroke-width: 1.5; filter: url(#softShadow); }
      .label { font: 700 26px "Inter", "Segoe UI", Arial, sans-serif; fill: #23304a; letter-spacing: 0; }
      .hint { font: 500 17px "Inter", "Segoe UI", Arial, sans-serif; fill: #667085; letter-spacing: 0; }
      .word { font: 800 54px "Inter", "Segoe UI", Arial, sans-serif; fill: #151c2f; letter-spacing: 0; }
      .sub { font: 500 20px "Inter", "Segoe UI", Arial, sans-serif; fill: #667085; letter-spacing: 0; }
      .tiny { font: 600 15px "Inter", "Segoe UI", Arial, sans-serif; fill: #7a8497; letter-spacing: 0; }
      .whiteLine { fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; }
      .darkLine { fill: none; stroke: #18233f; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="2200" height="1600" fill="url(#bg)"/>
  <text x="96" y="92" class="word" font-size="58">Day Sphere</text>
  <text x="96" y="132" class="sub">Logo and Android app icon direction samples for personal schedule, tasks, and notes.</text>

  <!-- Sample A -->
  <g transform="translate(80 180)">
    <rect class="card" x="0" y="0" width="2040" height="250" rx="34"/>
    <text x="34" y="52" class="label">A. Orbital Planner</text>
    <text x="34" y="82" class="hint">Clear blue sphere, orbit line, and task check.</text>
    <g transform="translate(76 106)">
      <rect x="0" y="0" width="118" height="118" rx="30" fill="url(#blue)" filter="url(#iconShadow)"/>
      <circle cx="59" cy="59" r="31" fill="rgba(255,255,255,0.92)"/>
      <path d="M25 72c32-42 75-48 92-21" class="whiteLine" stroke-width="8" opacity="0.82"/>
      <path d="M39 58l14 14 29-32" fill="none" stroke="#3f7cff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="91" cy="38" r="8" fill="#fff"/>
    </g>
    <g transform="translate(300 78)">
      <circle cx="64" cy="64" r="58" fill="url(#blue)"/>
      <circle cx="64" cy="64" r="31" fill="#fff" opacity="0.94"/>
      <path d="M18 76c36-52 91-58 118-25" class="whiteLine" stroke-width="9" opacity="0.80"/>
      <path d="M43 63l16 16 33-37" fill="none" stroke="#3f7cff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="100" cy="39" r="8" fill="#fff"/>
    </g>
    <text x="452" y="122" class="word">Day Sphere</text>
    <text x="456" y="157" class="sub">Your day in orbit: schedule, tasks, notes.</text>
    <g transform="translate(1565 62)">
      <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#blue)"/>
      <circle cx="50" cy="50" r="26" fill="#fff" opacity="0.95"/>
      <path d="M23 63c27-35 63-41 78-18" class="whiteLine" stroke-width="7" opacity="0.86"/>
      <path d="M36 50l12 12 25-28" fill="none" stroke="#3f7cff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="124" y="40" class="tiny">Android icon</text>
      <text x="124" y="67" class="tiny">strong at small size</text>
    </g>
  </g>

  <!-- Sample B -->
  <g transform="translate(80 465)">
    <rect class="card" x="0" y="0" width="2040" height="250" rx="34"/>
    <text x="34" y="52" class="label">B. Sunrise Agenda</text>
    <text x="34" y="82" class="hint">Warm morning energy with a simple checklist.</text>
    <g transform="translate(76 106)">
      <rect x="0" y="0" width="118" height="118" rx="30" fill="url(#sun)" filter="url(#iconShadow)"/>
      <circle cx="58" cy="54" r="28" fill="#fff4d5"/>
      <path d="M25 78h68" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <rect x="32" y="73" width="54" height="24" rx="8" fill="#fff" opacity="0.92"/>
      <path d="M43 84l8 8 18-20" fill="none" stroke="#ff7e67" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(300 78)">
      <rect x="0" y="0" width="128" height="128" rx="34" fill="url(#sun)"/>
      <circle cx="64" cy="54" r="31" fill="#fff2cf"/>
      <path d="M28 83h72" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
      <rect x="35" y="78" width="58" height="28" rx="9" fill="#fff" opacity="0.94"/>
      <path d="M47 91l9 9 20-23" fill="none" stroke="#ff7e67" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="452" y="122" class="word">Day Sphere</text>
    <text x="456" y="157" class="sub">A fresh start for plans, reminders, and notes.</text>
    <g transform="translate(1565 62)">
      <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#sun)"/>
      <circle cx="50" cy="45" r="24" fill="#fff2cf"/>
      <path d="M23 67h54" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <rect x="31" y="63" width="39" height="21" rx="7" fill="#fff" opacity="0.94"/>
      <text x="124" y="40" class="tiny">Android icon</text>
      <text x="124" y="67" class="tiny">friendly and bright</text>
    </g>
  </g>

  <!-- Sample C -->
  <g transform="translate(80 750)">
    <rect class="card" x="0" y="0" width="2040" height="250" rx="34"/>
    <text x="34" y="52" class="label">C. Focus Compass</text>
    <text x="34" y="82" class="hint">Clock, compass, and planning in one mark.</text>
    <g transform="translate(76 106)">
      <rect x="0" y="0" width="118" height="118" rx="30" fill="url(#ink)" filter="url(#iconShadow)"/>
      <circle cx="59" cy="59" r="37" fill="none" stroke="#fff" stroke-width="6" opacity="0.95"/>
      <path d="M59 29v14M59 75v14M29 59h14M75 59h14" stroke="#87f0d5" stroke-width="5" stroke-linecap="round"/>
      <path d="M88 30L72 72 46 46Z" fill="#fff"/>
      <path d="M30 88L46 46 72 72Z" fill="#87f0d5" opacity="0.55"/>
      <circle cx="59" cy="59" r="6" fill="#87f0d5"/>
      <circle cx="59" cy="59" r="2.2" fill="#fff" opacity="0.92"/>
    </g>
    <g transform="translate(300 78)">
      <circle cx="64" cy="64" r="62" fill="url(#ink)"/>
      <circle cx="64" cy="64" r="39" fill="none" stroke="#fff" stroke-width="7" opacity="0.95"/>
      <path d="M64 31v16M64 81v16M31 64h16M81 64h16" stroke="#87f0d5" stroke-width="5" stroke-linecap="round"/>
      <path d="M96 32L79 79 49 49Z" fill="#fff"/>
      <path d="M32 96L49 49 79 79Z" fill="#87f0d5" opacity="0.55"/>
      <circle cx="64" cy="64" r="7" fill="#87f0d5"/>
      <circle cx="64" cy="64" r="2.6" fill="#fff" opacity="0.92"/>
    </g>
    <text x="452" y="122" class="word">Day Sphere</text>
    <text x="456" y="157" class="sub">Find the next thing, then move through the day.</text>
    <g transform="translate(1565 62)">
      <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#ink)"/>
      <circle cx="50" cy="50" r="31" fill="none" stroke="#fff" stroke-width="6"/>
      <path d="M50 23v13M50 64v13M23 50h13M64 50h13" stroke="#87f0d5" stroke-width="5" stroke-linecap="round"/>
      <path d="M75 25L62 62 38 38Z" fill="#fff"/>
      <path d="M25 75L38 38 62 62Z" fill="#87f0d5" opacity="0.55"/>
      <circle cx="50" cy="50" r="5" fill="#87f0d5"/>
      <circle cx="50" cy="50" r="2" fill="#fff" opacity="0.92"/>
      <text x="124" y="40" class="tiny">Android icon</text>
      <text x="124" y="67" class="tiny">professional and calm</text>
    </g>
  </g>

  <!-- Sample D -->
  <g transform="translate(80 1035)">
    <rect class="card" x="0" y="0" width="2040" height="250" rx="34"/>
    <text x="34" y="52" class="label">D. Note Constellation</text>
    <text x="34" y="82" class="hint">Tasks and notes connected like a daily map.</text>
    <g transform="translate(76 106)">
      <rect x="0" y="0" width="118" height="118" rx="30" fill="url(#violet)" filter="url(#iconShadow)"/>
      <path d="M31 76l23-33 28 18 16-24" class="whiteLine" stroke-width="5" opacity="0.92"/>
      <circle cx="31" cy="76" r="8" fill="#fff"/>
      <circle cx="54" cy="43" r="8" fill="#fff"/>
      <circle cx="82" cy="61" r="8" fill="#fff"/>
      <circle cx="98" cy="37" r="8" fill="#fff"/>
      <rect x="31" y="80" width="56" height="18" rx="6" fill="#fff" opacity="0.88"/>
      <path d="M43 89h31" stroke="#7b61ff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(300 78)">
      <circle cx="64" cy="64" r="62" fill="url(#violet)"/>
      <path d="M27 82l25-39 32 20 20-28" class="whiteLine" stroke-width="6" opacity="0.92"/>
      <circle cx="27" cy="82" r="8" fill="#fff"/>
      <circle cx="52" cy="43" r="8" fill="#fff"/>
      <circle cx="84" cy="63" r="8" fill="#fff"/>
      <circle cx="104" cy="35" r="8" fill="#fff"/>
      <rect x="34" y="86" width="60" height="20" rx="7" fill="#fff" opacity="0.90"/>
      <path d="M47 96h33" stroke="#7b61ff" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="452" y="122" class="word">Day Sphere</text>
    <text x="456" y="157" class="sub">Plans, notes, and ideas connected into a daily map.</text>
    <g transform="translate(1565 62)">
      <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#violet)"/>
      <path d="M25 65l20-30 24 16 17-24" class="whiteLine" stroke-width="5"/>
      <circle cx="25" cy="65" r="7" fill="#fff"/>
      <circle cx="45" cy="35" r="7" fill="#fff"/>
      <circle cx="69" cy="51" r="7" fill="#fff"/>
      <circle cx="86" cy="27" r="7" fill="#fff"/>
      <text x="124" y="40" class="tiny">Android icon</text>
      <text x="124" y="67" class="tiny">modern and expressive</text>
    </g>
  </g>

  <!-- Sample E -->
  <g transform="translate(80 1320)">
    <rect class="card" x="0" y="0" width="2040" height="250" rx="34"/>
    <text x="34" y="52" class="label">E. Quiet Dashboard</text>
    <text x="34" y="82" class="hint">Layered personal cards around a calm sphere.</text>
    <g transform="translate(76 106)">
      <rect x="0" y="0" width="118" height="118" rx="30" fill="url(#calm)" filter="url(#iconShadow)"/>
      <rect x="31" y="26" width="55" height="69" rx="14" fill="#fff" opacity="0.92"/>
      <path d="M44 44h29M44 58h25M44 72h18" stroke="#1fb6ff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="83" cy="34" r="16" fill="#18233f" opacity="0.18"/>
      <path d="M82 29a14 14 0 1 0 13 20 18 18 0 1 1-13-20z" fill="#fff"/>
    </g>
    <g transform="translate(300 78)">
      <circle cx="64" cy="64" r="62" fill="url(#calm)"/>
      <rect x="36" y="28" width="56" height="72" rx="15" fill="#fff" opacity="0.94"/>
      <path d="M49 48h30M49 63h26M49 78h19" stroke="#1fb6ff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="92" cy="35" r="17" fill="#18233f" opacity="0.16"/>
      <path d="M91 30a15 15 0 1 0 14 21 19 19 0 1 1-14-21z" fill="#fff"/>
    </g>
    <text x="452" y="122" class="word">Day Sphere</text>
    <text x="456" y="157" class="sub">A quiet place for today, tasks, and memory.</text>
    <g transform="translate(1565 62)">
      <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#calm)"/>
      <rect x="29" y="22" width="45" height="58" rx="12" fill="#fff" opacity="0.94"/>
      <path d="M40 39h23M40 52h20M40 65h15" stroke="#1fb6ff" stroke-width="5" stroke-linecap="round"/>
      <text x="124" y="40" class="tiny">Android icon</text>
      <text x="124" y="67" class="tiny">soft and personal</text>
    </g>
  </g>
</svg>
