<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Day Sphere Focus Compass revised logo</title>
  <desc id="desc">A revised centered compass logo concept for Day Sphere, including app icon, Android icon preview, and wordmark.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="0.55" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#ecfbf7"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17263f"/>
      <stop offset="1" stop-color="#248b86"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#1e2b45" flood-opacity="0.16"/>
    </filter>
    <filter id="iconShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#152036" flood-opacity="0.22"/>
    </filter>
    <style>
      .card { fill: rgba(255,255,255,0.82); stroke: rgba(23,38,63,0.08); stroke-width: 1.5; filter: url(#softShadow); }
      .title { font: 800 70px "Inter", "Segoe UI", Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .label { font: 800 30px "Inter", "Segoe UI", Arial, sans-serif; fill: #1f2a44; letter-spacing: 0; }
      .body { font: 500 22px "Inter", "Segoe UI", Arial, sans-serif; fill: #667085; letter-spacing: 0; }
      .small { font: 600 18px "Inter", "Segoe UI", Arial, sans-serif; fill: #7a8497; letter-spacing: 0; }
    </style>
    <g id="focusCompassIcon">
      <rect x="0" y="0" width="512" height="512" rx="124" fill="url(#ink)"/>
      <circle cx="256" cy="256" r="164" fill="none" stroke="#ffffff" stroke-width="30" opacity="0.96"/>
      <path d="M256 112v62M256 338v62M112 256h62M338 256h62" fill="none" stroke="#87f0d5" stroke-width="25" stroke-linecap="round"/>
      <path d="M386 126L292 292 220 220Z" fill="#ffffff"/>
      <path d="M126 386L220 220 292 292Z" fill="#87f0d5" opacity="0.56"/>
      <circle cx="256" cy="256" r="31" fill="#87f0d5"/>
      <circle cx="256" cy="256" r="11" fill="#ffffff" opacity="0.92"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#pageBg)"/>
  <text x="90" y="104" class="title">Day Sphere</text>
  <text x="94" y="150" class="body">Focus Compass revised: centered compass, aligned green crosshair, and Android-ready app icon.</text>

  <rect class="card" x="80" y="205" width="1440" height="690" rx="44"/>

  <g transform="translate(150 292)" filter="url(#iconShadow)">
    <use href="#focusCompassIcon"/>
  </g>

  <g transform="translate(730 315)">
    <text x="0" y="58" class="title" font-size="64">Day Sphere</text>
    <text x="4" y="108" class="body">Personal schedule, tasks, notes, and reminders in one calm daily compass.</text>
    <text x="4" y="166" class="label">Adjusted center</text>
    <text x="4" y="205" class="body">Dot, crosshair, ring, and needle pivot now share one center.</text>
  </g>

  <g transform="translate(750 590)">
    <text x="0" y="0" class="label">Android icon previews</text>
    <g transform="translate(0 46)">
      <g transform="scale(0.3125)">
        <use href="#focusCompassIcon"/>
      </g>
      <text x="188" y="58" class="body">160 px preview</text>
      <text x="188" y="93" class="small">center details included</text>
    </g>
    <g transform="translate(370 66)">
      <g transform="scale(0.203125)">
        <use href="#focusCompassIcon"/>
      </g>
      <text x="132" y="45" class="body">104 px</text>
      <text x="132" y="78" class="small">launcher scale</text>
    </g>
    <g transform="translate(575 82)">
      <g transform="scale(0.140625)">
        <use href="#focusCompassIcon"/>
      </g>
      <text x="96" y="35" class="body">72 px</text>
      <text x="96" y="66" class="small">small check</text>
    </g>
  </g>
</svg>
