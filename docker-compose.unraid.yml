services:
  web-day-sphere:
    container_name: web-day-sphere
    image: web-day-sphere:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "36524:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DAY_SPHERE_DATA_DIR: /app/.day-sphere
      DAY_SPHERE_OBSIDIAN_DIR: /app/.day-sphere/obsidian-vault
    volumes:
      - /mnt/user/appdata/Web-Day-Sphere/data:/app/.day-sphere
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
